name: Deploy to GitHub Release

description: This GitHub Action deploys built artifacts to GitHub Release.

runs:
  using: composite
  steps:
    - name: Download artifatcs
      uses: actions/download-artifact@v8
      with:
        path: artifact
    - name: Provision artifact
      shell: pwsh
      run: |
        Rename-Item -Path artifact/capreze_installer/capreze.msi -NewName capreze_${{env.BUILD_VERSION}}.msi
        Compress-Archive -Path artifact/capreze/* -DestinationPath capreze_${{env.BUILD_VERSION}}.zip
        Compress-Archive -Path artifact/capreze_win-x64/* -DestinationPath capreze_${{env.BUILD_VERSION}}_win-x64.zip
        Compress-Archive -Path artifact/capreze_win-x86/* -DestinationPath capreze_${{env.BUILD_VERSION}}_win-x86.zip
        Compress-Archive -Path artifact/capreze_installer/* -DestinationPath capreze_${{env.BUILD_VERSION}}_installer.zip
    - name: Create release
      uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64
      with:
        files: |
          capreze_${{env.BUILD_VERSION}}.zip
          capreze_${{env.BUILD_VERSION}}_win-x64.zip
          capreze_${{env.BUILD_VERSION}}_win-x86.zip
          capreze_${{env.BUILD_VERSION}}_installer.zip
